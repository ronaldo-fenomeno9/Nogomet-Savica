name: Keep Supabase Alive

on:
  schedule:
    # Svaki dan u 08:00 UTC (10:00 po hrvatskom ljetnom vremenu)
    - cron: '0 8 * * *'
  workflow_dispatch: # omogućuje ručno pokretanje iz GitHub sučelja

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Simuliraj posjetitelja koji pregledava par tabova (stvarni pozivi bazi)
        run: |
          URL="https://tjstyxrqmqenfxdnyymy.supabase.co/rest/v1"
          KEY="${{ secrets.SUPABASE_ANON_KEY }}"

          # Svaki "tab" = koje tablice ta stranica stvarno čita
          declare -A PAGES
          PAGES[ljestvica]="players,matches,match_players"
          PAGES[statistika]="players,matches,match_players,goals"
          PAGES[termini]="matches,players,match_players,goals"
          PAGES[strijelci]="players,matches,goals,match_players"
          PAGES[obracuni]="players,matches,match_players,kitty_transactions"
          PAGES[arhiva]="players,matches,match_players,goals"

          ALL_PAGES=(ljestvica statistika termini strijelci obracuni arhiva)
          COUNT=$(( (RANDOM % 3) + 2 ))  # 2, 3 ili 4 stranice
          SHUFFLED=($(printf "%s\n" "${ALL_PAGES[@]}" | shuf))

          echo "Danas 'posjećujem' $COUNT stranica:"

          for i in $(seq 0 $((COUNT - 1))); do
            PAGE="${SHUFFLED[$i]}"
            echo "→ Otvaram /$PAGE"
            IFS=',' read -ra TABLES <<< "${PAGES[$PAGE]}"
            for TABLE in "${TABLES[@]}"; do
              curl -s -o /dev/null -w "    $TABLE -> %{http_code}\n" \
                "$URL/$TABLE?select=*&limit=5" \
                -H "apikey: $KEY" \
                -H "Authorization: Bearer $KEY"
            done
            sleep $(( (RANDOM % 5) + 2 ))
          done

          echo "Simulacija posjete gotova! ✅"
