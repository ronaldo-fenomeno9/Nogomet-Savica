name: Keep Supabase Alive

on:
  schedule:
    # Pokreće se 8x dnevno (svaka 3 sata); svaki put ima šansu da se "presk oči"
    # pa stvarni broj pingova po danu varira (obično 4-8x)
    - cron: '0 5,8,11,14,17,20,23,2 * * *'
  workflow_dispatch: # omogućuje ručno pokretanje iz GitHub sučelja

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Nasumično odluči hoće li se danas ovaj ping izvršiti (~70% šanse)
        id: decide
        run: |
          ROLL=$(( RANDOM % 100 ))
          if [ $ROLL -lt 70 ]; then
            echo "run=yes" >> $GITHUB_OUTPUT
            echo "Kocka je pala na $ROLL — ping se izvršava."
          else
            echo "run=no" >> $GITHUB_OUTPUT
            echo "Kocka je pala na $ROLL — preskačem ovaj termin (simulacija da nitko baš svaki put ne 'svrati')."
          fi

      - name: Simuliraj posjetitelja koji pregledava par tabova (stvarni pozivi bazi)
        if: steps.decide.outputs.run == 'yes'
        run: |
          URL="https://tjstyxrqmqenfxdnyymy.supabase.co/rest/v1"
          KEY="${{ secrets.SUPABASE_ANON_KEY }}"

          # Svaki "tab" = koje tablice ta stranica stvarno čita
          declare -A PAGES
          PAGES[ljestvica]="players,matches,match_players"
          PAGES[statistika]="players,matches,match_players,goals"
          PAGES[termini]="matches,players,match_players,goals"
          PAGES[strijelci]="players,matches,goals,match_players"
          PAGES[obracuni]="players,matches,match_players,kitty_transactions"
          PAGES[arhiva]="players,matches,match_players,goals"

          ALL_PAGES=(ljestvica statistika termini strijelci obracuni arhiva)
          COUNT=$(( (RANDOM % 3) + 1 ))  # 1, 2 ili 3 stranice po pokretanju
          SHUFFLED=($(printf "%s\n" "${ALL_PAGES[@]}" | shuf))

          echo "Ovaj put 'posjećujem' $COUNT stranica:"

          for i in $(seq 0 $((COUNT - 1))); do
            PAGE="${SHUFFLED[$i]}"
            echo "→ Otvaram /$PAGE"
            IFS=',' read -ra TABLES <<< "${PAGES[$PAGE]}"
            for TABLE in "${TABLES[@]}"; do
              curl -s -o /dev/null -w "    $TABLE -> %{http_code}\n" \
                "$URL/$TABLE?select=*&limit=5" \
                -H "apikey: $KEY" \
                -H "Authorization: Bearer $KEY"
            done
            sleep $(( (RANDOM % 4) + 1 ))
          done

          echo "Simulacija posjete gotova! ✅"

      - name: Preskočeno
        if: steps.decide.outputs.run == 'no'
        run: echo "Ovaj termin je preskočen radi prirodnijeg uzorka aktivnosti."
